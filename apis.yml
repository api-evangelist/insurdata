aid: insurdata
name: Insurdata
description: >-
  Insurdata is a re/insurance technology company providing global, best-in-class
  geocoding and property exposure data. Its unique multi-sourced methodology delivers
  the highest-resolution, building-level geocoding available worldwide, together with
  building-perimeter and property-characteristic data that lets underwriters and
  catastrophe modelers assess risk at the individual-property level at the point of
  underwriting. Insurdata's augmented exposure data has been used in collaborative
  studies with carriers such as Canopius and flood modelers such as Fathom to sharpen
  exposure levels and average-annual-loss (AAL) forecasts. The company is a portfolio
  company of Anthemis and serves the global re/insurance market.
